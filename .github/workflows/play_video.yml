name: Play YouTube Video RDP with Random NordVPN

on:
  workflow_dispatch:
    inputs:
      youtube_link:
        description: 'YouTube Video URL'
        required: true
        type: string
      log_id:
        description: 'Database Log ID'
        required: true
        type: string
      webhook_url:
        description: 'Dashboard Webhook URL'
        required: true
        type: string

jobs:
  run-browsers:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenVPN
        run: |
          winget install OpenVPNTechnologies.OpenVPN --accept-source-agreements --accept-package-agreements

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium webdriver-manager

      - name: Connect to Random NordVPN Server
        env:
          NORD_USER: ${{ secrets.NORD_USER }}
          NORD_PASS: ${{ secrets.NORD_PASS }}
        shell: pwsh
        run: |
          Set-Content -Path "auth.txt" -Value "$env:NORD_USER`n$env:NORD_PASS" -NoNewline
          
          $ovpnFiles = Get-ChildItem -Path "configs" -Filter "*.ovpn"
          if ($ovpnFiles.Count -eq 0) {
              Write-Error "No .ovpn configuration files found in configs/ folder!"
              exit 1
          }
          $selectedOvpn = $ovpnFiles | Get-Random
          Write-Host "Selected Random VPN Location File: $($selectedOvpn.Name)"
          
          $openvpnPath = "C:\Program Files\OpenVPN\bin\openvpn.exe"
          if (!(Test-Path $openvpnPath)) {
              $openvpnPath = "C:\Program Files (x86)\OpenVPN\bin\openvpn.exe"
          }
          
          Write-Host "Starting OpenVPN tunnel with $($selectedOvpn.Name)..."
          Start-Process -FilePath $openvpnPath -ArgumentList "--config `"$($selectedOvpn.FullName)`" --auth-user-pass auth.txt --background"
          
          Start-Sleep -Seconds 20

      - name: Report VPN Location & Run 4 Browsers
        env:
          YT_LINK: ${{ github.event.inputs.youtube_link }}
          LOG_ID: ${{ github.event.inputs.log_id }}
          WEBHOOK_URL: ${{ github.event.inputs.webhook_url }}
        shell: python
        run: |
          import os
          import time
          import requests
          from concurrent.futures import ThreadPoolExecutor
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from webdriver_manager.chrome import ChromeDriverManager

          url = os.environ.get("YT_LINK")
          log_id = os.environ.get("LOG_ID")
          webhook_url = os.environ.get("WEBHOOK_URL")

          try:
              geo_res = requests.get("http://ip-api.com/json/", timeout=15).json()
              ip_data = {
                  "log_id": log_id,
                  "ip": geo_res.get("query", "Unknown"),
                  "country": geo_res.get("country", "Unknown"),
                  "region": geo_res.get("regionName", "Unknown")
              }
              requests.post(webhook_url, json=ip_data, timeout=10)
              print("Successfully reported random VPN location to dashboard:", ip_data)
          except Exception as e:
              print(f"Failed to report location: {e}")

          def launch_browser_instance(instance_id):
              print(f"Starting browser instance {instance_id}...")
              options = Options()
              options.add_argument("--no-sandbox")
              options.add_argument("--disable-dev-shm-usage")
              options.add_argument("--autoplay-policy=no-user-gesture-required")
              
              driver = webdriver.Chrome(service=Service(ChromeDriverManager().install()), options=options)
              try:
                  driver.get(url)
                  time.sleep(5)
                  
                  script = """
                  var videos = document.querySelectorAll('video');
                  videos.forEach(function(v) {
                      v.playbackRate = 2.0;
                      v.play();
                  });
                  """
                  driver.execute_script(script)
                  print(f"Browser {instance_id} playing video at 2x speed via random VPN.")
                  
                  time.sleep(1200)
              except Exception as e:
                  print(f"Error in browser {instance_id}: {e}")
              finally:
                  driver.quit()
                  print(f"Browser {instance_id} closed.")

          with ThreadPoolExecutor(max_workers=4) as executor:
              executor.map(launch_browser_instance, range(1, 5))
          
          print("All tasks completed.")
