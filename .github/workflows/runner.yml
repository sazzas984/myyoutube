name: Play YouTube Video RDP

on:
  workflow_dispatch:
    inputs:
      youtube_link:
        description: 'YouTube Video URL'
        required: true
        type: string

jobs:
  run-browsers:
    runs-on: windows-latest
    timeout-minutes: 25 # Safeguard to make sure it stops after max time
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Selenium & WebDriver Manager
        run: |
          pip install selenium webdriver-manager

      - name: Run 4 Browsers to Play Video at 2x Speed
        env:
          YT_LINK: ${{ github.event.inputs.youtube_link }}
        shell: python
        run: |
          import os
          import time
          from concurrent.futures import ThreadPoolExecutor
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from webdriver_manager.chrome import ChromeDriverManager

          url = os.environ.get("YT_LINK")
          print(f"Target URL: {url}")

          def launch_browser_instance(instance_id):
              print(f"Starting browser instance {instance_id}...")
              options = Options()
              # Options to ensure headless or stable running on CI windows runner
              options.add_argument("--no-sandbox")
              options.add_argument("--disable-dev-shm-usage")
              options.add_argument("--autoplay-policy=no-user-gesture-required")
              
              driver = webdriver.Chrome(service=Service(ChromeDriverManager().install()), options=options)
              try:
                  driver.get(url)
                  time.sleep(5) # Let page load
                  
                  # Execute JS to force 2x speed and play video
                  script = """
                  var videos = document.querySelectorAll('video');
                  videos.forEach(function(v) {
                      v.playbackRate = 2.0;
                      v.play();
                  });
                  """
                  driver.execute_script(script)
                  print(f"Browser {instance_id} is playing video at 2x speed.")
                  
                  # Keep alive for 20 minutes (1200 seconds)
                  time.sleep(1200)
              except Exception as e:
                  print(f"Error in browser {instance_id}: {e}")
              finally:
                  driver.quit()
                  print(f"Browser {instance_id} closed.")

          # Run 4 browser instances concurrently using threads
          with ThreadPoolExecutor(max_workers=4) as executor:
              executor.map(launch_browser_instance, range(1, 5))
          
          print("All browser tasks completed.")
